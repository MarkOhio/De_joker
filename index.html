<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joke Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Comic+Neue:wght@400;700&family=Luckiest+Guy&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container">

  <header class="top-row">
    <div class="greeting-box" id="greeting-box">
      <h1><span id="greeting-word">Good morning</span> <span id="username-display">User</span></h1>

      <div class="name-popup" id="name-popup">
        <input type="text" id="name-input" maxlength="10" placeholder="Enter nickname">
        <label>
          <input type="checkbox" id="save-name-check">
          Save
        </label>
      </div>
    </div>

    <button class="icon-btn" id="theme-toggle" aria-label="Toggle theme">
      <svg class="icon-sun" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="4.5"></circle>
        <line x1="12" y1="1.5" x2="12" y2="4"></line>
        <line x1="12" y1="20" x2="12" y2="22.5"></line>
        <line x1="1.5" y1="12" x2="4" y2="12"></line>
        <line x1="20" y1="12" x2="22.5" y2="12"></line>
        <line x1="4.2" y1="4.2" x2="6" y2="6"></line>
        <line x1="18" y1="18" x2="19.8" y2="19.8"></line>
        <line x1="4.2" y1="19.8" x2="6" y2="18"></line>
        <line x1="18" y1="6" x2="19.8" y2="4.2"></line>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
        <path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5 8.5 8.5 0 1 0 20.5 14.5z"></path>
      </svg>
    </button>
  </header>

  <h2 class="want-heading">
    Want to hear a joke?
    <svg class="eyes-icon" viewBox="0 0 60 30" width="46" height="23">
      <circle cx="15" cy="15" r="13" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"></circle>
      <circle cx="18" cy="17" r="6" fill="#1a1a1a"></circle>
      <circle cx="45" cy="15" r="13" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"></circle>
      <circle cx="48" cy="17" r="6" fill="#1a1a1a"></circle>
    </svg>
  </h2>

  <div class="controls-row">
    <select id="category-select">
      <option value="dad">Dad Jokes</option>
      <option value="programming">Programming</option>
      <option value="dark">Dark</option>
      <option value="knock-knock">Knock-Knock</option>
      <option value="pun">Punny</option>
    </select>
    <button class="icon-btn" id="refresh-btn" aria-label="New jokes">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"></polyline>
        <polyline points="1 20 1 14 7 14"></polyline>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
      </svg>
    </button>
  </div>

  <div class="cards-grid" id="cards-grid">

    <div class="joke-card" id="joke-card-0">
      <svg class="heart-icon" id="heart-0" onclick="toggleFavorite(0)" viewBox="0 0 24 24" width="28" height="28">
        <path d="M12 21s-6.7-4.35-9.3-8.1C1.1 10.5 1.5 7.2 4.2 5.6c2.1-1.25 4.6-.6 5.8 1.1.4.55.7 1.15 1 1.75.3-.6.6-1.2 1-1.75 1.2-1.7 3.7-2.35 5.8-1.1 2.7 1.6 3.1 4.9 1.5 7.3C18.7 16.65 12 21 12 21z"></path>
      </svg>
      <div class="loading-dots"><span></span><span></span><span></span></div>
      <p class="joke-text" id="joke-text-0">Joke will be here</p>
      <div class="joke-card-bottom">
        <button onclick="shareJoke(0)">Share</button>
        <button onclick="copyJoke(0)">Copy</button>
      </div>
    </div>

    <div class="joke-card" id="joke-card-1">
      <svg class="heart-icon" id="heart-1" onclick="toggleFavorite(1)" viewBox="0 0 24 24" width="28" height="28">
        <path d="M12 21s-6.7-4.35-9.3-8.1C1.1 10.5 1.5 7.2 4.2 5.6c2.1-1.25 4.6-.6 5.8 1.1.4.55.7 1.15 1 1.75.3-.6.6-1.2 1-1.75 1.2-1.7 3.7-2.35 5.8-1.1 2.7 1.6 3.1 4.9 1.5 7.3C18.7 16.65 12 21 12 21z"></path>
      </svg>
      <div class="loading-dots"><span></span><span></span><span></span></div>
      <p class="joke-text" id="joke-text-1">Joke will be here</p>
      <div class="joke-card-bottom">
        <button onclick="shareJoke(1)">Share</button>
        <button onclick="copyJoke(1)">Copy</button>
      </div>
    </div>

    <div class="joke-card" id="joke-card-2">
      <svg class="heart-icon" id="heart-2" onclick="toggleFavorite(2)" viewBox="0 0 24 24" width="28" height="28">
        <path d="M12 21s-6.7-4.35-9.3-8.1C1.1 10.5 1.5 7.2 4.2 5.6c2.1-1.25 4.6-.6 5.8 1.1.4.55.7 1.15 1 1.75.3-.6.6-1.2 1-1.75 1.2-1.7 3.7-2.35 5.8-1.1 2.7 1.6 3.1 4.9 1.5 7.3C18.7 16.65 12 21 12 21z"></path>
      </svg>
      <div class="loading-dots"><span></span><span></span><span></span></div>
      <p class="joke-text" id="joke-text-2">Joke will be here</p>
      <div class="joke-card-bottom">
        <button onclick="shareJoke(2)">Share</button>
        <button onclick="copyJoke(2)">Copy</button>
      </div>
    </div>

  </div>

  <p class="joke-counter" id="joke-counter">Jokes viewed: 0</p>

  <div class="favorites-section">
    <button class="icon-btn" id="favorites-toggle" aria-label="Toggle favorites">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor">
        <path d="M12 21s-6.7-4.35-9.3-8.1C1.1 10.5 1.5 7.2 4.2 5.6c2.1-1.25 4.6-.6 5.8 1.1.4.55.7 1.15 1 1.75.3-.6.6-1.2 1-1.75 1.2-1.7 3.7-2.35 5.8-1.1 2.7 1.6 3.1 4.9 1.5 7.3C18.7 16.65 12 21 12 21z"></path>
      </svg>
    </button>
    <div id="favorites-list" class="favorites-list">Your favorite jokes will show up here.</div>
  </div>

  <footer>
    <span>&copy; 2026</span>
    <a href="instructions.html">How it works</a>
    <span>Created by Mark Ohio</span>
  </footer>

</div>

<div id="toast"></div>

<script src="script.js"></script>

</body>
</html>
